<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Pizza Cruiser Menu Card</h1>
    <!-- Form-->

    <form id="menu-form">
    <label for="menu-input"> Paste your menu as JSON </label>
    <textarea id="menu-input" rows="8"> 
 [
  {"name": "Cheese Pizza", "price": 7.99},
  {"name": "Caesar Salad", "price": 6.99},
  {"name": "Honey BBQ Wings", "price": 8.99},
  {"name": "Coke", "price": 3.00}
  ]  
 </textarea>
    <button type="submit">Show my menu </button>
    </form>

<p id="count"></p>
<p id="menu-text"></p>

<script src="script.js"></script>
</body>
</html>
